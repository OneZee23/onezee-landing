name: Build image

# Builds the Astro Node image and pushes it to GHCR as :latest (+ :<sha>).
# This runs entirely on GitHub — no cluster/server access needed — so it is not
# affected by any origin firewall. The server pulls :latest with docker compose.

on:
  push:
    branches: [master]
    paths-ignore:
      - 'deploy/**'
      - 'docs/**'
      - 'README.md'
      - 'LAUNCH.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/onezee23/onezee-landing:latest
            ghcr.io/onezee23/onezee-landing:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
