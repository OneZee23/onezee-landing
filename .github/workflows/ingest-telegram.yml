name: Ingest Telegram posts

# Reads the public Telegram channel, turns #site-tagged posts into blog content,
# commits them, and triggers a deploy. Runs on a schedule (default branch only)
# and on demand. Use the manual run with "backfill" to import the whole history.
#
# Schedule: every third day at 06:00 UTC.
# It used to be '*/15 * * * *', which GitHub throttled down to a run every two
# to four hours anyway - 1960 runs by 13 Sep 2026, drowning every other workflow
# in the Actions history. Nothing here needs that: posts are rare, and a new one
# reaches the site by hand in a minute.
#
# After publishing a post you want live now, do not wait for the schedule:
#   gh workflow run ingest-telegram.yml
# or the "Run workflow" button on the Actions tab.
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Walk the whole channel history (one-time backfill)'
        type: boolean
        default: false
      import_all:
        description: 'Bulk: also import all PoW posts (день N/30) without needing #site'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# Never let two ingest runs race (they'd double-commit).
concurrency:
  group: ingest-telegram
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Built-in token: its push deliberately does NOT trigger other
          # workflows, so the explicit "Trigger build" step below is the single
          # build trigger (new content builds exactly once, never twice).
          token: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify parser
        run: node scripts/test-parse.mjs

      - name: Ingest posts
        env:
          TELEGRAM_CHANNEL: onezee_co
          SITE_TAG: '#site'
          BACKFILL: ${{ (github.event_name == 'workflow_dispatch' && inputs.backfill) && '1' || '' }}
          IMPORT_ALL_POW: ${{ (github.event_name == 'workflow_dispatch' && inputs.import_all) && '1' || '' }}
        run: node scripts/ingest-telegram.mjs

      - name: Commit & push new posts
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new posts."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "onezee-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "content: ingest Telegram posts"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Builds a fresh :latest; Watchtower on the server auto-pulls it.
        run: gh workflow run build-image.yml --ref "${{ github.ref_name }}"
