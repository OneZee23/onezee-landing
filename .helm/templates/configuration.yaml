# ConfigMap and Secret templates
# For static frontend, these are not needed but kept for consistency

{{- if .Values.publicConfig }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Values.namespace }}
data:
  {{- range $key, $value := .Values.publicConfig }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

{{- if .Values.secretConfig }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretConfig }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

