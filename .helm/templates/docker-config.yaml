{{- if .Values.werf.image.app }}
{{- $dockerconfig := .Files.Get "secret/dockerconfig" }}
{{- if $dockerconfig }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-dockerconfig
  namespace: {{ .Values.namespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $dockerconfig | b64enc }}
{{- end }}
{{- end }}

