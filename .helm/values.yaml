app:
  port: 4321  # Astro Node server (HOST=0.0.0.0 PORT=4321)
  # External Redis URL for likes/views. Usually leave empty and use the in-cluster
  # `redis:` below. If you prefer a managed Redis, set this in
  # .helm/secret-values-prod.yaml (werf-encrypted): app.redisUrl: "redis://:pw@host:6379"
  redisUrl: ""

# Tiny in-cluster Redis for the likes/views counters. When enabled, the app's
# REDIS_URL points at it automatically (app.redisUrl above, if set, wins).
redis:
  enabled: false
  image: redis:7-alpine
  storage: 1Gi  # DO Block Storage PVC — counts persist across pod restarts

replication:
  minReplicas: 1
  maxReplicas: 2

resources:
  requests:
    cpu: 100m
    memory: 160Mi
  limits:
    cpu: 500m
    memory: 384Mi

probes:
  startup:
    path: /health/check
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30
  liveness:
    path: /health/check
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /health/check
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

service:
  port: 80

ingress:
  enabled: true
  host: ""
  paths:
    - /
  tls:
    enabled: false
  annotations: {}

namespace: onezee-landing

werf:
  env: prod
  image:
    app: <will be set by werf>

