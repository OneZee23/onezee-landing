app:
  port: 4321  # Astro Node server (HOST=0.0.0.0 PORT=4321)
  # Connection string for the likes counter. Leave empty to run without likes
  # (the like button hides itself). Set this in .helm/secret-values-prod.yaml
  # (werf-encrypted) so it isn't committed in plaintext, e.g.
  #   app:
  #     redisUrl: "redis://:password@my-redis:6379"
  redisUrl: ""

replication:
  minReplicas: 1
  maxReplicas: 2

resources:
  requests:
    cpu: 100m
    memory: 160Mi
  limits:
    cpu: 500m
    memory: 384Mi

probes:
  startup:
    path: /health/check
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30
  liveness:
    path: /health/check
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /health/check
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

service:
  port: 80

ingress:
  enabled: true
  host: ""
  paths:
    - /
  tls:
    enabled: false
  annotations: {}

namespace: onezee-landing

werf:
  env: prod
  image:
    app: <will be set by werf>

